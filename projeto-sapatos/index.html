<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="War Tênis - Tênis e Sneakers Online. Compre os melhores tênis e sneakers das marcas mais populares. Encontre o par perfeito para o seu estilo.">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/components/header.css">
    <link rel="stylesheet" href="./css/components/hero.css">
    <link rel="stylesheet" href="./css/components/product-category.css">
    <link rel="stylesheet" href="./css/components/product-grid.css">
    <title>War Tênis | Tênis e Sneakers Online</title>
</head>

<body>

    <!-- Header com logo e navegação -->
    <header class="header">
        <div class="logo">
            <!-- Logo -->
            <h1><a href="/" title="War Tênis - Tênis e Sneakers Online"><img src="./images/logo/logo.svg"
                        alt="War Tênis - Tênis e Sneakers Online"></a></h1>
        </div>
        <nav class="nav-center" aria-label="Categorias principais">
            <!-- Navegação principal -->
            <ul>
                <li><a href="#">Masculino</a></li>
                <li><a href="#">Feminino</a></li>
                <li><a href="#">Outlet</a></li>
            </ul>
        </nav>

        <nav class="nav-right" aria-label="Categorias secundárias">
            <!-- Navegação secundária -->
            <ul>
                <li><a href="#">Nossas lojas</a></li>
                <li><a href="#">Sobre</a></li>

                <li><a href="#" aria-label="Minha conta"><img src="/projeto-sapatos/images/icons/user.svg"
                            alt="Minha conta"></a></li>

                <li><a href="#" aria-label="Ajuda"><img src="/projeto-sapatos/images/icons/help.svg" alt="Ajuda"></a>
                </li>

                <li><a href="#" aria-label="Carrinho de compras"><img src="/projeto-sapatos/images/icons/bag.svg"
                            alt="Carrinho de compras"></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Seção Hero -->
        <section class="hero-section">
            <!-- Conteúdo Hero -->
            <div class="hero-overlay">
                <div class="hero-content">
                    <span class="hero-subtitle">Krypton One</span>
                    <h2 class="hero-title">Transforme qualquer passo em presença.</h2>
                    <div class="hero-buttons">
                        <a href="#" class="btn btn-outline">Ver modelos</a>
                        <a href="#" class="btn btn-fillet">Comprar</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Seção de categorias de tênis -->
        <section class="categories-section">
            <!-- Conteúdo Categorias -->
            <div class="category-card casual">
                <a href="#" class="category-link">
                    <span class="overlay"></span>
                    <span class="category-name btn btn-outline">Casual</span>
                </a>
            </div>
            <div class="category-card esportivo">
                <a href="#" class="category-link">
                    <span class="overlay"></span>
                    <span class="category-name btn btn-outline">Esportivo</span>
                </a>
            </div>
            <div class="category-card moderno">
                <a href="#" class="category-link">
                    <span class="overlay"></span>
                    <span class="category-name btn btn-outline">Moderno</span>
                </a>
            </div>
            <div class="category-card futurista">
                <a href="#" class="category-link">
                    <span class="overlay"></span>
                    <span class="category-name btn btn-outline">Futurista</span>
                </a>
            </div>
        </section>

        <!-- Grid com produtos em destaque -->
        <section class="grid-section">
            <!-- Grid com produtos em destaque -->
            <div class="card top1">
                <div class="top1-content">
                    <h3 class="card-title">War Tênis | Tênis e Sneakers Online</h3>
                    <p class="card-subtitle">Estilo Urbano com atitude</p>
                    <div class="cta-group">
                        <a href="#" class="btn btn-outline">Feminino</a>
                        <a href="#" class="btn btn-outline">Masculino</a>
                    </div>
                </div>
            </div>
            <div class="card top2"></div>
            <div class="card midL"></div>
            <div class="card midR"></div>
            <div class="card bottonL"></div>
            <div class="card bottomR"></div>
        </section>
    </main>

    <!-- Footer com informações de contato e links -->
    <footer class="footer">
        <div class="footer-contact">
            <!-- Informações de contato -->
        </div>
        <div class="footer-links">
            <!-- Links úteis e navegação secundária -->
        </div>
    </footer>


</body>

</html>
